name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      # Cache cargo registry + target dir; Rust dependency compilation
      # dominates the job's runtime.
      - uses: Swatinem/rust-cache@v2

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Typecheck and build frontend
        run: npm run build

      - name: Build the command-line sidecar
        run: npm run build:cli

      - name: Run Rust tests
        run: cargo test --workspace --manifest-path src-tauri/Cargo.toml

      - name: Build product site
        run: npm run build:site

  # The `#[cfg(windows)]` arms only compile on Windows, and the macOS arms
  # only on macOS — without this they would first be built at release time,
  # when a tag already exists. A check is enough: the app bundle itself is
  # built by the release workflow.
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install frontend dependencies
        run: npm ci

      # tauri-build needs the sidecar binary in place before the app crate
      # will compile.
      - name: Build the command-line sidecar
        run: npm run build:cli

      - name: Check the workspace
        run: cargo check --workspace --manifest-path src-tauri/Cargo.toml
