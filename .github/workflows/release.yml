name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 0.2.0) — bumps versions, commits, tags, builds, publishes"
        required: true
        type: string

permissions:
  contents: write

jobs:
  # Resolves the release tag; on manual dispatch also bumps the version in
  # package.json, Cargo.toml and tauri.conf.json, commits and pushes the tag.
  # The bump commit is pushed with GITHUB_TOKEN, which does not re-trigger
  # workflows — the build below runs in this same workflow run instead.
  bump:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=v${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - if: github.event_name == 'workflow_dispatch'
        run: echo "${{ inputs.version }}" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'

      - uses: actions/checkout@v4
        if: github.event_name == 'workflow_dispatch'

      - uses: actions/setup-node@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          node-version: 24

      - name: Bump versions
        if: github.event_name == 'workflow_dispatch'
        run: |
          npm version "${{ inputs.version }}" --no-git-tag-version
          node -e 'const fs=require("fs");const p="src-tauri/tauri.conf.json";const c=JSON.parse(fs.readFileSync(p,"utf8"));c.version="${{ inputs.version }}";fs.writeFileSync(p,JSON.stringify(c,null,2)+"\n")'
          sed -i 's/^version = ".*"/version = "${{ inputs.version }}"/' src-tauri/Cargo.toml
          # Keep the lockfile in sync with the bumped crate version.
          cargo metadata --format-version 1 --manifest-path src-tauri/Cargo.toml > /dev/null

      - name: Commit, tag, push
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json src-tauri/Cargo.toml src-tauri/Cargo.lock src-tauri/tauri.conf.json
          git commit -m "Release v${{ inputs.version }}"
          git tag "v${{ inputs.version }}"
          git push origin HEAD:main
          git push origin "v${{ inputs.version }}"

  release:
    needs: bump
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.platform }}
    # Apple notarization occasionally hangs; fail fast so the job can be
    # rerun instead of burning the six-hour cap.
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ needs.bump.outputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      # Cache cargo registry + target dir per platform; Rust dependency
      # compilation dominates the build's runtime.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.platform }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm ci

      - name: Build the command-line sidecar
        run: npm run build:cli

      - name: Run tests
        run: |
          npm test
          cargo test --workspace --manifest-path src-tauri/Cargo.toml

      - name: Import Apple signing certificate
        if: matrix.platform == 'macos-latest'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > signing-cert.p12
          security create-keychain -p actions build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p actions build.keychain
          security import signing-cert.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k actions build.keychain
          rm signing-cert.p12
          security find-identity -v

      # With the certificate imported and APPLE_* env vars set, tauri-action
      # signs the app with the Developer ID and notarizes the dmg via
      # notarytool before attaching it to the release. TAURI_SIGNING_* signs
      # the updater artifacts (latest.json + .sig) for auto-update.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ needs.bump.outputs.tag }}
          releaseName: "Folio ${{ needs.bump.outputs.tag }}"
          releaseDraft: false

      # The command-line binary on its own, for machines without the app
      # (a headless server, or a container). One tarball per target; the
      # macOS and Linux runners also cross-build their other architecture,
      # which needs no extra toolchain for a crate with no C dependencies.
      - name: Package the command-line binary
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.bump.outputs.tag }}
        run: |
          set -euo pipefail
          host=$(rustc -vV | sed -n 's/^host: //p' | tr -d '\r')
          pack() {
            triple="$1"; bin="$2"
            mkdir -p "pack/$triple"
            if [[ "$triple" == *windows* ]]; then
              cp "$bin" "pack/$triple/folio.exe"
              (cd "pack/$triple" && 7z a "../../folio-$triple.zip" folio.exe > /dev/null)
              gh release upload "$TAG" "folio-$triple.zip" --clobber
            else
              cp "$bin" "pack/$triple/folio"
              tar czf "folio-$triple.tar.gz" -C "pack/$triple" folio
              gh release upload "$TAG" "folio-$triple.tar.gz" --clobber
            fi
          }
          ext=""; [[ "$host" == *windows* ]] && ext=".exe"
          pack "$host" "src-tauri/binaries/folio-$host$ext"
          case "$host" in
            aarch64-apple-darwin)
              rustup target add x86_64-apple-darwin
              cargo build --release -p folio-cli --target x86_64-apple-darwin --manifest-path src-tauri/Cargo.toml
              pack x86_64-apple-darwin src-tauri/target/x86_64-apple-darwin/release/folio ;;
            x86_64-unknown-linux-gnu)
              sudo apt-get install -y gcc-aarch64-linux-gnu
              rustup target add aarch64-unknown-linux-gnu
              CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc \
                cargo build --release -p folio-cli --target aarch64-unknown-linux-gnu --manifest-path src-tauri/Cargo.toml
              pack aarch64-unknown-linux-gnu src-tauri/target/aarch64-unknown-linux-gnu/release/folio ;;
          esac
