<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Folio</title>
    <script>
      // Apply the persisted theme before first paint (avoids a flash of
      // the default Paper theme). Kept in sync with src/theme.ts.
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem("folio-theme") || "paper";
      } catch {}
    </script>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <header id="toolbar">
      <div class="toolbar-actions">
        <button id="open-btn" type="button" title="Open a Markdown file">
          Open<kbd>⌘O</kbd>
        </button>
        <button id="save-btn" type="button" title="Save (⌘⇧S for Save As)">
          Save<kbd>⌘S</kbd>
        </button>
      </div>
      <span id="doc-title">Untitled</span>
      <div class="toolbar-end">
        <button
          id="copy-agent-btn"
          type="button"
          title="Copy document as Markdown — ready to paste into your agent"
          aria-label="Copy document as Markdown"
        >
          <svg
            width="13"
            height="13"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <rect x="9" y="9" width="12" height="12" rx="2" />
            <path d="M5 15V5a2 2 0 0 1 2-2h10" />
          </svg>
        </button>
        <button
          id="float-btn"
          type="button"
          title="Float on Top (⌥⌘W)"
          aria-label="Float on Top"
          aria-pressed="false"
        >
          <svg
            width="13"
            height="13"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M9 4h6l-1 7 3 3v2H7v-2l3-3-1-7z" />
            <path d="M12 16v5" />
          </svg>
        </button>
      </div>
    </header>
    <main id="editor"></main>
    <textarea
      id="source-editor"
      hidden
      spellcheck="false"
      aria-label="Markdown source"
    ></textarea>
    <footer id="statusbar">
      <span id="doc-path"></span>
      <span id="live-badge" hidden title="Floating on top — reloading when the file changes on disk">live</span>
      <span id="word-count"></span>
    </footer>
    <div id="license-overlay" hidden>
      <div
        id="license-dialog"
        role="dialog"
        aria-modal="true"
        aria-labelledby="license-heading"
      >
        <h2 id="license-heading">Folio Pro</h2>
        <div id="license-enter-view">
          <p class="license-copy">
            Enter your license key to unlock Pro features — export, focus
            mode, and more.
          </p>
          <textarea
            id="license-key-input"
            rows="3"
            spellcheck="false"
            placeholder="FOLIO1-…"
            aria-label="License key"
          ></textarea>
          <p id="license-error" role="alert" hidden></p>
          <div class="license-actions">
            <button id="license-cancel-btn" type="button">Cancel</button>
            <button id="license-unlock-btn" type="button">Unlock</button>
          </div>
        </div>
        <div id="license-active-view" hidden>
          <p class="license-copy">
            Folio Pro is unlocked for
            <strong id="license-email"></strong>.
          </p>
          <div class="license-actions">
            <button id="license-remove-btn" type="button">Remove license</button>
            <button id="license-done-btn" type="button">Done</button>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
