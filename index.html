<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Folio</title>
    <script>
      // Apply the persisted theme before first paint (avoids a flash of
      // the default Paper theme). Kept in sync with src/theme.ts.
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem("folio-theme") || "paper";
      } catch {}
    </script>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <header id="toolbar">
      <div class="toolbar-actions">
        <button id="nav-back-btn" type="button" title="Back (⌘[)" aria-label="Back" disabled>
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M15 18l-6-6 6-6" />
          </svg>
        </button>
        <button id="nav-forward-btn" type="button" title="Forward (⌘])" aria-label="Forward" disabled>
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M9 18l6-6-6-6" />
          </svg>
        </button>
        <button id="open-btn" type="button" title="Open a Markdown file">
          Open<kbd>⌘O</kbd>
        </button>
        <button id="save-btn" type="button" title="Save (⌘⇧S for Save As)">
          Save<kbd>⌘S</kbd>
        </button>
      </div>
      <span id="doc-title">Untitled</span>
      <div class="toolbar-end">
        <button
          id="annotations-btn"
          type="button"
          title="Show annotations"
          aria-label="Show annotations"
          aria-pressed="false"
        >
          <svg
            width="13"
            height="13"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <line x1="8" y1="6" x2="21" y2="6" />
            <line x1="8" y1="12" x2="21" y2="12" />
            <line x1="8" y1="18" x2="21" y2="18" />
            <line x1="3" y1="6" x2="3.01" y2="6" />
            <line x1="3" y1="12" x2="3.01" y2="12" />
            <line x1="3" y1="18" x2="3.01" y2="18" />
          </svg>
        </button>
        <button
          id="feedback-btn"
          type="button"
          title="Export review feedback for your agent (⌥⌘R)"
          aria-label="Export review feedback"
        >
          <svg
            width="13"
            height="13"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" />
            <line x1="8" y1="8" x2="16" y2="8" />
            <line x1="8" y1="11" x2="13" y2="11" />
          </svg>
        </button>
        <button
          id="copy-agent-btn"
          type="button"
          title="Copy document as Markdown — ready to paste into your agent"
          aria-label="Copy document as Markdown"
        >
          <svg
            width="13"
            height="13"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <rect x="9" y="9" width="12" height="12" rx="2" />
            <path d="M5 15V5a2 2 0 0 1 2-2h10" />
          </svg>
        </button>
        <button
          id="float-btn"
          type="button"
          title="Float on Top (⌥⌘W)"
          aria-label="Float on Top"
          aria-pressed="false"
        >
          <svg
            width="13"
            height="13"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M9 4h6l-1 7 3 3v2H7v-2l3-3-1-7z" />
            <path d="M12 16v5" />
          </svg>
        </button>
      </div>
    </header>
    <div id="main-row">
      <main id="editor"></main>
      <aside id="panel" hidden aria-label="Reading panel">
        <header id="panel-header">
          <div id="panel-tabs" role="tablist" aria-label="Panel">
            <button id="panel-tab-outline" type="button" role="tab" aria-selected="true" aria-controls="panel-outline">Outline</button>
            <button id="panel-tab-annotations" type="button" role="tab" aria-selected="false" aria-controls="panel-annotations">Annotations</button>
          </div>
          <button id="panel-close" type="button" title="Hide panel" aria-label="Hide panel">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
              <path d="M18 6 6 18M6 6l12 12" />
            </svg>
          </button>
        </header>
        <section id="panel-outline" role="tabpanel" aria-labelledby="panel-tab-outline">
          <textarea
            id="takeaway"
            rows="3"
            spellcheck="true"
            placeholder="What I took from it, in my own words"
            aria-label="What I took from it"
          ></textarea>
          <div id="reading-stats" aria-live="polite"></div>
          <ol id="outline-list" tabindex="0" aria-label="Document outline"></ol>
        </section>
        <section id="panel-annotations" role="tabpanel" aria-labelledby="panel-tab-annotations" hidden>
          <div id="annot-list"></div>
        </section>
      </aside>
    </div>
    <main id="print-root" class="folio-export" aria-hidden="true"></main>
    <textarea
      id="source-editor"
      hidden
      spellcheck="false"
      aria-label="Markdown source"
    ></textarea>
    <footer id="review-bar" hidden>
      <span id="review-bar-hint" hidden></span>
      <span id="review-bar-label"></span>
      <div id="review-bar-actions">
        <button id="review-changes-btn" type="button">Request changes</button>
        <button id="review-approve-btn" type="button">✓ Approve</button>
      </div>
    </footer>
    <footer id="statusbar">
      <span id="doc-path"></span>
      <span id="live-badge" hidden title="Floating on top — reloading when the file changes on disk">live</span>
      <span id="word-count"></span>
    </footer>
    <div id="telemetry-overlay" hidden>
      <div
        id="telemetry-dialog"
        role="dialog"
        aria-modal="true"
        aria-labelledby="telemetry-heading"
      >
        <h2 id="telemetry-heading">Usage statistics</h2>
        <p class="dialog-copy">
          Help improve Folio by sharing anonymous usage statistics — feature
          usage only, never document content or file paths. Google Analytics
          loads only if you opt in, and you can change your mind any time in
          View → Usage Statistics.
        </p>
        <div class="dialog-actions">
          <button id="telemetry-decline-btn" type="button">No thanks</button>
          <button id="telemetry-accept-btn" type="button">Enable statistics</button>
        </div>
      </div>
    </div>
  </body>
</html>
