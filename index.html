<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>mdrer</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <header id="toolbar">
      <div class="toolbar-actions">
        <button id="open-btn" type="button" title="Open a Markdown file">
          Open<kbd>⌘O</kbd>
        </button>
        <button id="save-btn" type="button" title="Save (⌘⇧S for Save As)">
          Save<kbd>⌘S</kbd>
        </button>
      </div>
      <span id="doc-title">Untitled</span>
      <div class="toolbar-balance" aria-hidden="true"></div>
    </header>
    <main id="editor"></main>
    <textarea
      id="source-editor"
      hidden
      spellcheck="false"
      aria-label="Markdown source"
    ></textarea>
    <footer id="statusbar">
      <span id="doc-path"></span>
      <span id="word-count"></span>
    </footer>
  </body>
</html>
