<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Folio</title>
    <script>
      // Apply the persisted theme before first paint (avoids a flash of
      // the default Paper theme). Kept in sync with src/theme.ts.
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem("folio-theme") || "paper";
      } catch {}
    </script>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <header id="toolbar">
      <div class="toolbar-actions">
        <button id="nav-back-btn" type="button" title="Back (⌘[)" aria-label="Back" disabled>
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M15 18l-6-6 6-6" />
          </svg>
        </button>
        <button id="nav-forward-btn" type="button" title="Forward (⌘])" aria-label="Forward" disabled>
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M9 18l6-6-6-6" />
          </svg>
        </button>
        <button id="open-btn" type="button" title="Open a Markdown file">
          Open<kbd>⌘O</kbd>
        </button>
        <button id="save-btn" type="button" title="Save (⌘⇧S for Save As)">
          Save<kbd>⌘S</kbd>
        </button>
      </div>
      <span id="doc-title">Untitled</span>
      <div class="toolbar-end">
        <button
          id="annotations-btn"
          type="button"
          title="Show annotations"
          aria-label="Show annotations"
          aria-pressed="false"
        >
          <svg
            width="13"
            height="13"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <line x1="8" y1="6" x2="21" y2="6" />
            <line x1="8" y1="12" x2="21" y2="12" />
            <line x1="8" y1="18" x2="21" y2="18" />
            <line x1="3" y1="6" x2="3.01" y2="6" />
            <line x1="3" y1="12" x2="3.01" y2="12" />
            <line x1="3" y1="18" x2="3.01" y2="18" />
          </svg>
        </button>
        <button
          id="feedback-btn"
          type="button"
          title="Export review feedback for your agent (⌥⌘R)"
          aria-label="Export review feedback"
        >
          <svg
            width="13"
            height="13"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" />
            <line x1="8" y1="8" x2="16" y2="8" />
            <line x1="8" y1="11" x2="13" y2="11" />
          </svg>
        </button>
        <button
          id="copy-agent-btn"
          type="button"
          title="Copy document as Markdown — ready to paste into your agent"
          aria-label="Copy document as Markdown"
        >
          <svg
            width="13"
            height="13"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <rect x="9" y="9" width="12" height="12" rx="2" />
            <path d="M5 15V5a2 2 0 0 1 2-2h10" />
          </svg>
        </button>
        <button
          id="float-btn"
          type="button"
          title="Float on Top (⌥⌘W)"
          aria-label="Float on Top"
          aria-pressed="false"
        >
          <svg
            width="13"
            height="13"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M9 4h6l-1 7 3 3v2H7v-2l3-3-1-7z" />
            <path d="M12 16v5" />
          </svg>
        </button>
      </div>
    </header>
    <div id="main-row">
      <main id="editor"></main>
      <aside id="annot-sidebar" hidden aria-label="Review annotations">
        <header id="annot-sidebar-header">
          <span id="annot-sidebar-title">Annotations</span>
          <button id="annot-sidebar-close" type="button" title="Hide annotations" aria-label="Hide annotations">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
              <path d="M18 6 6 18M6 6l12 12" />
            </svg>
          </button>
        </header>
        <div id="annot-list"></div>
      </aside>
    </div>
    <textarea
      id="source-editor"
      hidden
      spellcheck="false"
      aria-label="Markdown source"
    ></textarea>
    <footer id="statusbar">
      <span id="doc-path"></span>
      <span id="live-badge" hidden title="Floating on top — reloading when the file changes on disk">live</span>
      <span id="word-count"></span>
    </footer>
    <div id="annot-overlay" hidden>
      <div
        id="annot-dialog"
        role="dialog"
        aria-modal="true"
        aria-labelledby="annot-heading"
      >
        <h2 id="annot-heading">Annotate selection</h2>
        <blockquote id="annot-quote"></blockquote>
        <div class="annot-kinds" role="radiogroup" aria-label="Annotation type">
          <label>
            <input type="radio" name="annot-kind" value="comment" checked />
            Comment
          </label>
          <label>
            <input type="radio" name="annot-kind" value="delete" />
            Mark for deletion
          </label>
          <label>
            <input type="radio" name="annot-kind" value="replace" />
            Suggest replacement
          </label>
        </div>
        <textarea
          id="annot-body"
          rows="3"
          spellcheck="false"
          placeholder="Your note for the agent…"
          aria-label="Annotation text"
        ></textarea>
        <div class="license-actions">
          <button id="annot-cancel-btn" type="button">Cancel</button>
          <button id="annot-save-btn" type="button">Save annotation</button>
        </div>
      </div>
    </div>
    <div id="license-overlay" hidden>
      <div
        id="license-dialog"
        role="dialog"
        aria-modal="true"
        aria-labelledby="license-heading"
      >
        <h2 id="license-heading">Folio Pro</h2>
        <div id="license-enter-view">
          <p class="license-copy">
            Enter your license key to unlock Pro features — export, focus
            mode, and more.
          </p>
          <textarea
            id="license-key-input"
            rows="3"
            spellcheck="false"
            placeholder="FOLIO1-…"
            aria-label="License key"
          ></textarea>
          <p id="license-error" role="alert" hidden></p>
          <div class="license-actions">
            <button id="license-cancel-btn" type="button">Cancel</button>
            <button id="license-unlock-btn" type="button">Unlock</button>
          </div>
        </div>
        <div id="license-active-view" hidden>
          <p class="license-copy">
            Folio Pro is unlocked for
            <strong id="license-email"></strong>.
          </p>
          <div class="license-actions">
            <button id="license-remove-btn" type="button">Remove license</button>
            <button id="license-done-btn" type="button">Done</button>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
