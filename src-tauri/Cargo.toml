[package]
name = "folio"
version = "0.8.0"
description = "Folio — a calm, Typora-style Markdown editor"
authors = ["rahult"]
edition = "2021"
# The crate also builds the folio-license CLI (src/bin/folio-license.rs);
# default-run marks `folio` as the app binary so `tauri build` picks it.
default-run = "folio"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "folio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# The license-signing CLI is a dev/vendor tool. Gating it behind a
# non-default feature keeps it out of `tauri build` (which runs
# `cargo build --bins`) and out of the shipped app bundle.
[[bin]]
name = "folio-license"
path = "src/bin/folio-license.rs"
required-features = ["license-cli"]

[features]
license-cli = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
tauri-plugin-updater = "2.10.1"
tauri-plugin-process = "2.3.1"
rusqlite = { version = "0.32", features = ["bundled"] }
tauri-plugin-single-instance = "2"

[target.'cfg(target_os = "macos")'.dependencies]
# Used only for the LaunchServices FFI behind "Set as Default Markdown App".
core-foundation = "0.10"

